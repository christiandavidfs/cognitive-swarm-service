# Cognitive Swarm Service config — all connectors/models declared here, no code change to add one.
# Per-request `connectors`/`models` override these defaults.

service:
  host: "0.0.0.0"
  port: 8000
  # cors origins, log level, etc.
  log_level: "info"

# Judge backend — who implements Choice/Score/Noul (Juicios 1-5).
# backend: heuristic (free, local regex) | jev (any SystemOne-compatible endpoint:
#   TypeSafe Jev, local Kev, Vercel gateway). Env JUDGE wins over this file.
# Switch judges per need without touching code: local Kev for free/private,
# paid Jev for max accuracy, heuristic when offline.
judge:
  backend: heuristic   # default stays offline-safe. Production blocks below.
  jev_via: typesafe     # typesafe | vercel
  base_url: ""          # override: e.g. http://127.0.0.1:8019 (local Kev)
  model: ""             # override: e.g. kev-latest | typesafe-ai/jev
  api_key_env: ""       # env var holding the key (default per via)
  temperature: 1.0      # post-hoc scaling, fitted on held-out (Kev-AGNews: 1.9)
  seats:                # per-decision override (Fase 4+); classify is live today
    classify: heuristic
  # Production (promoted 2026-09-30, MEASUREMENTS.md): fine-tuned judge + T=1.9.
  # Serve via scripts/serve_all.sh, then flip this block on:
  # backend: jev
  # base_url: "http://127.0.0.1:8020"
  # model: "kev-latest"
  # temperature: 1.9

# Resolver backends — optional deterministic solvers, tried in order.
# Each name loads service/backends/<name>.py; missing backends are skipped
# (memory + retrieval still serve). Override via BACKENDS env (comma-separated).
#   cognitive_swarm: pip install <path-or-package> providing `cognitive_swarm`
backends:
  - cognitive_swarm

# Default Tier 3 connectors (category-gated per Connector.categories).
# NOTE (fase 5, plan/remediacion-hallazgos.md): every `reliability` below is a
# POC PRIOR, not a measured frequency — no labeled conflict dataset exists.
# Changing these values is not calibration/tuning. Same for the bonuses in
# service/corroboration.py (INDEPENDENCE_BONUS, RECENCY_BONUS): tie-break
# constants only.
# enabled:false stays registered but not queried unless caller asks for it explicitly.
connectors:
  # L3 factual / contested — reliability = authority weight used by Corroborator
  wikidata:
    enabled: true
    reliability: 0.8
    timeout_s: 5
    cache_ttl_s: 86400
  openalex:
    enabled: true
    reliability: 0.9
    timeout_s: 6
    cache_ttl_s: 3600
    # Semantic Scholar alt: set provider: semantic_scholar + SEMANTIC_SCHOLAR_API_KEY env
  local_docs:
    enabled: true
    reliability: 0.8
    source_dir: "${LOCAL_DOCS_DIR}"
    match_threshold: 0.35
    chunk_size: 3
  # Stubs — modular, scalable; fill credentials via env, flip enabled:true
  confluence:
    enabled: false
    reliability: 0.85
    base_url: "${CONFLUENCE_BASE_URL}"
    # space, auth via CONFLUENCE_API_TOKEN env
  databricks_sql:
    enabled: false   # needs DATABRICKS_HOST/WAREHOUSE_ID/TOKEN (see .env.example).
    # Disabled 2026-10-01: without creds it fails closed ([]) while spawning
    # a token subprocess per minute — cost without contribution. All measured
    # pilots run without it. Flip to true after `databricks auth login` +
    # `python scripts/seed_databricks.py --verify`.
    reliability: 1.0
    warehouse_id: "${DATABRICKS_WAREHOUSE_ID}"
    host: "${DATABRICKS_HOST}"
    query_template: "SELECT answer, source, reliability FROM ${DATABRICKS_KNOWLEDGE_TABLE} WHERE question ILIKE '%{question}%' LIMIT 5"
    timeout_s: 12
  postgres:
    enabled: false
    reliability: 1.0
    dsn: "${POSTGRES_DSN}"   # postgresql://user:pass@host/db
  generic_http:
    enabled: false
    reliability: 0.6
    base_url: "${GENERIC_HTTP_BASE_URL}"
  # Free ground-truth demo source (no key). Per-request `connectors:["pokeapi"]`
  # or flip enabled:true. Proves the one-file connector pattern live.
  pokeapi:
    enabled: false
    reliability: 0.95
    timeout_s: 8
  # Web search via any SearXNG instance (self-hosted = free, no key).
  # Hits are candidates (reliability 0.6, not independent) — truth comes
  # from downstream corroboration + Wikidata crossing, never from search alone.
  search:
    enabled: false
    reliability: 0.6
    timeout_s: 8
    per_page: 5

# Model registry — choosable per request via `models: ["phi","qwen","minimax-m3",...]`
# type: mlx | api (openai-compatible). MLX models load sequentially on 8GB (one at a time).
models:
  phi:
    enabled: true
    type: mlx
    path: "mlx-community/phi-3.5-mini-instruct-4bit"
    strengths: ["reasoning", "math", "logic"]
    ram_gb: 2.5
  qwen:
    enabled: true
    type: mlx
    path: "mlx-community/Qwen2.5-3B-Instruct-4bit"
    strengths: ["code", "math"]
    ram_gb: 2.0
  qwen_05b:
    enabled: false
    type: mlx
    path: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
    strengths: ["routing"]
    ram_gb: 1.0
  minimax-m3:
    enabled: false   # needs OPENROUTER_API_KEY env to activate
    type: api
    model: "minimax/minimax-m3:free"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    strengths: ["general"]
  # Vercel AI Gateway (200+ models, one key). Flip enabled:true + AI_GATEWAY_API_KEY.
  # Uses: debate candidates (anywhere, incl. Docker), curiosity op3 paraphrase,
  # future vision front-ends. Nano default keeps experiments at fractions of a cent.
  gateway-nano:
    enabled: false
    type: api
    model: "openai/gpt-5-nano"
    base_url: "https://ai-gateway.vercel.sh/v1"
    api_key_env: "AI_GATEWAY_API_KEY"
    strengths: ["general", "paraphrase", "debate"]

auth:
  # API key auth for monetization (private service). Disabled for POC local dev.
  enabled: false
  # Comma-separated or list: ${SERVICE_API_KEY} or explicit keys. Env expansion supported.
  api_keys: ["${SERVICE_API_KEY}"]
  rate_limit_per_min: 60
  # Paths exempt from auth (health, docs)
  exempt_paths: ["/health", "/docs", "/openapi.json", "/redoc"]

memory:
  # VerifiedMemory JSON path (persists Tier 0). Procedure store shares it (procedure_sig field).
  # 0.85 reduces false blur on retrieval questions that share tokens (e.g. fall vs cause of fall)
  path: "./data/verified_memory.json"
  similarity_threshold: 0.85
  procedure_enabled: true
