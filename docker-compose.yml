services:
  swarm-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Optional local corpus for the local_docs connector:
      # - ./retrieval_corpus:/app/retrieval_corpus
    environment:
      # Optional deterministic backend (install package + enable):
      # BACKENDS: cognitive_swarm
      LOCAL_DOCS_DIR: /app/retrieval_corpus
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      # DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      # DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
      # CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      # CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      MEMORY_PATH: /app/data/verified_memory.json
    command: uvicorn service.app:app --host 0.0.0.0 --port 8000 --log-level info
